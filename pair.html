<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAHMANI-XMD PAIR CODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
      background: url("https://files.catbox.moe/aktbgo.jpg") center/cover;
      font-family: 'Segoe UI', sans-serif;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: -1;
    }
    .box {
      background: rgba(15,15,20,0.9); padding: 30px 22px;
      border-radius: 16px; max-width: 360px; width: 100%;
      text-align: center; backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(89,53,172,0.5);
    }
    h3 { color: #fff; font-size: 19px; margin-bottom: 8px; }
    p { color: #aaa; font-size: 12px; margin-bottom: 20px; }
    .input-container {
      display: flex; background: #000; padding: 5px; gap: 5px;
      border-radius: 12px; margin-top: 18px;
    }
    input {
      flex: 1; padding: 14px; border: none; border-radius: 8px;
      background: #e8e8e8; border-left: 3px solid #5935ac;
      font-size: 14px; outline: none;
    }
    input:focus { border-left-color: #c01736; }
    button {
      padding: 14px 18px; background: linear-gradient(135deg, #5935ac, #c01736);
      color: #fff; border: none; border-radius: 8px;
      font-weight: 700; font-size: 12px; cursor: pointer;
      letter-spacing: 1px; transition: 0.3s;
    }
    button:hover:not(:disabled) { transform: scale(1.05); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #pair { margin-top: 16px; min-height: 30px; }
    .status { color: #f0ad4e; font-size: 13px; }
    .error { color: #f44336; font-size: 13px; }
    #copy {
      display: inline-block; padding: 12px 22px; margin-top: 8px;
      background: linear-gradient(135deg, #c01736, #5935ac);
      border-radius: 10px; color: #fff; font-weight: bold;
      font-size: 15px; letter-spacing: 2px; cursor: pointer;
      animation: glow 1.5s infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 10px rgba(193,23,54,0.5); }
      to { box-shadow: 0 0 22px rgba(89,53,172,0.9); }
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>⚡ RAHMANI-XMD ⚡</h3>
    <p>Enter your WhatsApp number with country code</p>
    <p style="color:#25d366;font-size:11px">Example: 255693629079</p>
    
    <div class="input-container">
      <input type="tel" id="number" placeholder="255XXXXXXXXX" autocomplete="off">
      <button id="submit">SUBMIT</button>
    </div>
    
    <main id="pair"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const pairBox = document.getElementById("pair");
    const submitBtn = document.getElementById("submit");
    const numberInput = document.getElementById("number");

    async function Copy() {
      const copyEl = document.getElementById("copy");
      const code = copyEl.querySelector(".code")?.innerText || "";
      try { await navigator.clipboard.writeText(code); } catch(e) {}
      const original = copyEl.innerHTML;
      copyEl.innerHTML = '<span>✅ COPIED!</span>';
      setTimeout(() => { copyEl.innerHTML = original; }, 1500);
    }

    submitBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const num = numberInput.value.replace(/[^0-9]/g, "");
      
      if (!num || num.length < 10) {
        pairBox.innerHTML = '<span class="error">❌ Enter valid number!</span>';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "...";
      pairBox.innerHTML = '<span class="status">⏳ Generating code...</span>';

      try {
        const { data } = await axios(`/code?number=${num}`, { timeout: 90000 });
        const code = data.code || "";
        
        if (!code || code.includes("Unavailable")) {
          pairBox.innerHTML = '<span class="error">❌ Failed. Try again.</span>';
          submitBtn.disabled = false;
          submitBtn.innerText = "SUBMIT";
          return;
        }

        pairBox.innerHTML = `
          <div id="copy" onclick="Copy()">
            <div style="font-size:11px;margin-bottom:4px">TAP TO COPY</div>
            <div class="code">${code}</div>
          </div>
          <p style="color:#aaa;font-size:11px;margin-top:12px">
            Enter in WhatsApp → Linked Devices
          </p>
        `;
      } catch (err) {
        pairBox.innerHTML = '<span class="error">❌ Connection error!</span>';
        submitBtn.disabled = false;
        submitBtn.innerText = "SUBMIT";
      }
    });

    numberInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") submitBtn.click();
    });
  </script>
</body>
</html>
